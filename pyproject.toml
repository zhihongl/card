[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-detector"
version = "1.0.0"
description = "Detects potentially fraudulent credit cards based on daily transaction totals."
requires-python = ">=3.9"

[project.scripts]
fraud-detector = "fraud_detector.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
